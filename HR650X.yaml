# 联想 HR650X / HR630X 风扇曲线。
# 本机密码不要提交。复制为 HR650X.local.yaml，或导出 IPMI_PASSWORD。

ipmi:
  interface: lanplus
  host: "192.168.1.100"
  username: ADMIN
  # password: "change-me"

# 在服务器本机、已加载 ipmi_si 时：
# ipmi:
#   interface: open

interval: 10
hysteresis: 2
fallback_speed: 100
min_speed_on: 10
# 停止自动时写回的转速。100 会很吵，可改成 20，或 null 保持当前转速。
exit_speed: 20
# 开机后表面温度还读不到的这段时间保持这个转速，不降到关机档，也不拉满。
boot_speed: 20
command_timeout: 20
# 调节用 CPU 表面温度 CPU1_Temp。DTS 不读。
sensor_pattern: "^CPU[0-9]+[_ ]Temp$"

fan_speeds:
  - temp_range: [0, 5]
    speed: 2
  - temp_range: [5, 45]
    speed: 20
  - temp_range: [45, 55]
    speed: 30
  - temp_range: [55, 65]
    speed: 40
  - temp_range: [65, 75]
    speed: 55
  - temp_range: [75, 85]
    speed: 70
  - temp_range: [85, 100]
    speed: 100
