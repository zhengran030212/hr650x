# 联想 HR650X / HR630X 风扇曲线。
# 本机密码不要提交。复制为 HR650X.local.yaml，或导出 IPMI_PASSWORD。

ipmi:
  interface: lanplus
  host: "192.168.1.100"
  username: ADMIN
  # password: "change-me"

# 在服务器本机、已加载 ipmi_si 时：
# ipmi:
#   interface: open

interval: 10
hysteresis: 2
fallback_speed: 100
min_speed_on: 10
# 停止自动时写回的转速。100 会很吵，可改成 20，或 null 保持当前转速。
exit_speed: 20
# 开机后 DTS 还读不到的这段时间保持这个转速，不降到关机档，也不拉满。
boot_speed: 20
command_timeout: 20
# 没有 CPU DTS 时才用这个表达式。这台 BMC 的内核温度是 CPU1_DTS。
sensor_pattern: "^CPU[0-9]+[_ ]Temp$"

fan_speeds:
  - temp_range: [0, 5]    # 关机或传感器无读数
    speed: 2
  - temp_range: [5, 40]
    speed: 10
  - temp_range: [40, 45]
    speed: 14
  - temp_range: [45, 50]
    speed: 20
  - temp_range: [50, 60]
    speed: 50
  - temp_range: [60, 80]
    speed: 80
  - temp_range: [80, 100]
    speed: 100
